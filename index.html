<!DOCTYPE html>
<html lang="ja" data-theme="leather">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leathercraft CAD チュートリアル / Tutorials</title>
<!--
  ============================================================================
  Leathercraft CAD チュートリアル (単一ファイル・自己完結)

  ■ 更新手順
    1. 下の TUTORIAL_STAMP を上げる (yyyymmddhhmm)
    2. DATA の items に項目・動画を足す / 直す
    3. GitHub へ push (GitHub Pages で公開される)
    4. coffee-craft.net の versions の tutorial= 行を同じ値にする
       → アプリ側の「チュートリアル更新」バッジと NEW バッジがこの値で動く

  ■ 項目の書き方 (DATA.items の1要素)
    id      : 安定ID。アプリからのディープリンク (#item=ID) に使うので変えない
    cat     : DATA.cats の id
    ja / en : 項目名
    status  : 'video'   = 動画あり
              'planned' = 準備中 (プレースホルダ兼備忘録)
    updated : 'yyyymmddhhmm' この項目を最後に更新した日時 (NEW バッジ判定)
    videos  : [{yt:'YouTube ID', ja:'ラベル', en:'label', member:true(限定動画)}]
              先頭が最新。旧バージョンの動画は2つ目以降に置くと
              「以前のバージョンの動画」として折りたたみ表示される
              yt の代わりに list:'再生リストID' でプレイリスト埋め込みも可
    refs    : planned の項目に付ける「参考: 旧バージョンの動画」(形式は videos と同じ)
    note_ja / note_en : 説明文 (動画が無い間の備忘録としても)

  ■ アプリからの起動パラメータ (URLハッシュ)
    #lang=ja&item=qs-1&seen=202608261200
      lang : 初期言語 / item : 初期表示項目 / seen : 前回閲覧時の索引日時
      (seen より新しい updated を持つ項目に NEW が付く)
  ============================================================================
-->
<style>
  :root, [data-theme="leather"] {
    --bg: #f3ead9;        --bg2: #ece0c8;      --panel: #faf5ea;
    --ink: #3b2a1a;       --ink2: #7a6248;     --line: #d8c6a4;
    --acc: #8c5a2b;       --acc-ink: #fff;     --sel: #e5d3b3;
    --new: #c0392b;       --planned: #a89778;  --shadow: rgba(59,42,26,.12);
  }
  [data-theme="light"] {
    --bg: #f5f6f8;  --bg2: #eceef2; --panel: #ffffff;
    --ink: #24292f; --ink2: #6a737d; --line: #d8dde3;
    --acc: #2f6fb2; --acc-ink: #fff; --sel: #dfeafc;
    --new: #d33f49; --planned: #9aa3ad; --shadow: rgba(0,0,0,.10);
  }
  [data-theme="dark"] {
    --bg: #1e2126;  --bg2: #181a1e; --panel: #262a31;
    --ink: #e6e8eb; --ink2: #9aa3ad; --line: #3a4048;
    --acc: #5b9bd5; --acc-ink: #10151b; --sel: #33414f;
    --new: #ff7b6b; --planned: #6d7681; --shadow: rgba(0,0,0,.35);
  }
  [data-theme="coffee"] {
    --bg: #2b211a;  --bg2: #241b15; --panel: #33271e;
    --ink: #ecdfcf; --ink2: #b09a83; --line: #4d3d2f;
    --acc: #c8934f; --acc-ink: #26190f; --sel: #4a3826;
    --new: #ff8f6b; --planned: #82705c; --shadow: rgba(0,0,0,.4);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic UI", Meiryo,
                 "Segoe UI", system-ui, sans-serif;
    font-size: 15px; line-height: 1.65;
    display: flex; flex-direction: column;
  }
  a { color: var(--acc); }

  /* ---- header ---- */
  header {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 10px 16px; background: var(--bg2);
    border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 17px; margin: 0; white-space: nowrap; cursor: pointer; }
  header h1:hover { color: var(--acc); }
  header h1 .sub { color: var(--ink2); font-weight: normal; font-size: 12px; margin-left: 6px; }
  #search {
    flex: 1 1 160px; min-width: 120px; max-width: 340px;
    padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--panel); color: var(--ink); font-size: 14px;
  }
  .hctl { display: flex; align-items: center; gap: 6px; margin-left: auto; }
  .langbtn, #theme {
    padding: 5px 10px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--panel); color: var(--ink); font-size: 13px; cursor: pointer;
  }
  .langbtn.on { background: var(--acc); color: var(--acc-ink); border-color: var(--acc); }

  /* ---- layout ---- */
  #wrap { flex: 1; display: flex; min-height: 0; }
  nav {
    width: 320px; min-width: 240px; overflow-y: auto;
    border-right: 1px solid var(--line); background: var(--bg2);
    padding: 8px 0 24px;
  }
  main { flex: 1; overflow-y: auto; padding: 20px 28px 60px; }

  /* ---- tree ---- */
  .cat { margin: 2px 0; }
  .cat > summary {
    cursor: pointer; list-style: none; user-select: none;
    padding: 7px 12px; font-weight: bold; font-size: 14px;
    display: flex; align-items: center; gap: 6px;
  }
  .cat > summary::before { content: "▸"; transition: transform .12s; color: var(--ink2); }
  .cat[open] > summary::before { transform: rotate(90deg); }
  .cat > summary:hover { background: var(--sel); }
  .item {
    display: flex; align-items: center; gap: 7px;
    padding: 5px 10px 5px 30px; cursor: pointer; font-size: 13.5px;
    border-left: 3px solid transparent;
  }
  .item:hover { background: var(--sel); }
  .item.sel { background: var(--sel); border-left-color: var(--acc); }
  .item .ic { flex: 0 0 auto; font-size: 11px; }
  .item.planned { color: var(--planned); }
  .item .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .done { color: var(--acc); font-size: 11px; margin-left: auto; }
  .badge {
    flex: 0 0 auto; font-size: 10px; font-weight: bold; border-radius: 4px;
    padding: 0 5px; line-height: 16px; margin-left: auto;
  }
  .badge.new { background: var(--new); color: #fff; }
  .item .done + .badge, .badge + .done { margin-left: 4px; }
  .hidden { display: none !important; }

  /* ---- content ---- */
  #ttl { font-size: 21px; margin: 0 0 4px; }
  #crumb { color: var(--ink2); font-size: 12.5px; margin-bottom: 14px; }
  .vwrap {
    position: relative; width: 100%; max-width: 880px;
    aspect-ratio: 16 / 9; background: #000;
    border-radius: 10px; overflow: hidden;
    box-shadow: 0 4px 16px var(--shadow); margin: 10px 0 6px;
  }
  .vwrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .vlabel { color: var(--ink2); font-size: 12.5px; margin-bottom: 14px; }
  .memberCard, .placeholder {
    max-width: 880px; border: 1px dashed var(--line); border-radius: 10px;
    background: var(--panel); padding: 22px 24px; margin: 10px 0 16px;
  }
  .placeholder .big { font-size: 16px; font-weight: bold; margin-bottom: 6px; }
  .memberCard .big { font-size: 15px; font-weight: bold; margin-bottom: 8px; }
  .btn {
    display: inline-block; margin: 6px 8px 0 0; padding: 8px 16px;
    background: var(--acc); color: var(--acc-ink) !important;
    border-radius: 7px; text-decoration: none; font-size: 14px;
  }
  .note { max-width: 880px; white-space: pre-wrap; }
  .aboutNote {
    max-width: 880px; margin-top: 22px; padding: 14px 18px;
    border-left: 4px solid var(--acc); border-radius: 0 8px 8px 0;
    background: var(--panel); white-space: pre-wrap;
    color: var(--ink2); font-size: 13.5px; line-height: 1.75;
  }
  details.old { max-width: 880px; margin-top: 18px; }
  details.old > summary { cursor: pointer; color: var(--ink2); font-size: 13.5px; }
  .chk { margin: 18px 0 0; font-size: 13.5px; color: var(--ink2); }
  .chk input { vertical-align: -2px; }
  footer {
    padding: 10px 16px; border-top: 1px solid var(--line);
    color: var(--ink2); font-size: 12px; background: var(--bg2);
    display: flex; gap: 16px; flex-wrap: wrap;
  }
  #navToggle { display: none; }

  @media (max-width: 720px) {
    #wrap { flex-direction: column; }
    nav { width: 100%; max-height: 45vh; border-right: none; border-bottom: 1px solid var(--line); }
    main { padding: 14px; }
    #navToggle {
      display: block; width: 100%; padding: 8px; border: none;
      background: var(--bg2); color: var(--ink); font-size: 14px;
      border-bottom: 1px solid var(--line); cursor: pointer;
    }
    nav.collapsed { display: none; }
  }
</style>
</head>

  { id: 'faq-print-size', cat: 'faq', status: 'planned', updated: '202608261200',
    ja: '印刷した型紙のサイズが合わない',
    en: 'Printed patterns are not true to size',
    note_ja: 'プリンタは機種ごとにわずかな拡大縮小の癖があります。「印刷 > プリンタキャリブレーション」で補正してください（チュートリアルの「印刷」カテゴリ参照）。',
    note_en: 'Every printer scales slightly differently. Use Print > Printer Calibration to correct it (see the Printing category).' },
  { id: 'faq-connect', cat: 'faq', status: 'planned', updated: '202608261200',
    ja: '目打ちやオフセットが輪郭の途中で止まる',
    en: 'Pricking or offsets stop partway along an outline',
    note_ja: '線の端が僅かに離れていて、輪郭がつながっていないのが典型的な原因です。図面チェック（検図）機能で接続の問題を見つけて直す方法を解説予定。',
    note_en: 'The usual cause: endpoints that almost — but not quite — touch. A video on finding and fixing these with the drawing check feature is planned.' },
  { id: 'faq-mac-sonoma', cat: 'faq', status: 'video', updated: '202608261200',
    ja: 'macOSで画面の解像度がおかしい',
    en: 'Wrong screen resolution on macOS',
    note_ja: 'macOS Sonoma で画面がぼやける・解像度が合わない場合の対処法。',
    note_en: 'What to do when the app looks blurry or mis-scaled on macOS Sonoma.',
    videos: [ { yt: 'QG6JFO2WC14', ja: 'macOS Sonoma 14.0での解像度不具合の修正方法', en: 'Fixing the resolution issue on macOS Sonoma' } ] },
  { id: 'faq-shortcut', cat: 'faq', status: 'planned', updated: '202608261200',
    ja: 'ショートカットキー一覧はどこ？',
    en: 'Where is the shortcut key list?',
    note_ja: 'アプリ内の「ヘルプ > ホットキー一覧」で確認できます。よく使うものを動画でも紹介予定。',
    note_en: 'See Help > Hot Key List inside the app. A video on the most useful ones is planned.' },
  ]
};

const MEMBER_JOIN_URL = 'https://www.youtube.com/channel/UC59IzHV7gmbncsS0oeiC1yQ/join';

/* ============================================================
   ここから下は仕組み。項目の追加だけなら触る必要はありません。
   ============================================================ */
let lang = 'ja';
let seenStamp = '';      // アプリから渡される「前回閲覧時の索引日時」
let curItem = null;
let watched = {};
try { watched = JSON.parse(localStorage.getItem('lcadTutWatched') || '{}'); } catch (e) {}

function parseHash() {
  const h = {};
  for (const kv of location.hash.replace(/^#/, '').split('&')) {
    const i = kv.indexOf('=');
    if (i > 0) h[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1));
  }
  return h;
}

function setLang(l) {
  lang = (l === 'en') ? 'en' : 'ja';
  try { localStorage.setItem('lcadTutLang', lang); } catch (e) {}
  document.documentElement.lang = lang;
  applyUI();
  buildTree();
  render(curItem);
}

function setTheme(t) {
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem('lcadTutTheme', t); } catch (e) {}
  const sel = document.getElementById('theme');
  if (sel && sel.value !== t) sel.value = t;
}

function T(item, field) {          // item の言語別フィールド
  return item[lang] || item.ja || item.en || '';
}
function TN(item) {                // note
  return (lang === 'en' ? item.note_en : item.note_ja) || item.note_ja || item.note_en || '';
}

function isNew(item) {
  return seenStamp && item.updated && item.updated > seenStamp;
}

function applyUI() {
  const u = UI[lang];
  document.getElementById('hSub').textContent = u.sub;
  document.getElementById('search').placeholder = u.search;
  document.getElementById('btnJa').classList.toggle('on', lang === 'ja');
  document.getElementById('btnEn').classList.toggle('on', lang === 'en');
  document.getElementById('navToggle').textContent = u.navToggle;
  document.getElementById('fStamp').textContent =
    u.stamp + TUTORIAL_STAMP.replace(/^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})$/, '$1-$2-$3 $4:$5');
  const sel = document.getElementById('theme');
  const cur = document.documentElement.dataset.theme;
  sel.innerHTML = '';
  for (const k of ['leather', 'light', 'dark', 'coffee']) {
    const o = document.createElement('option');
    o.value = k; o.textContent = u.themes[k]; o.selected = (k === cur);
    sel.appendChild(o);
  }
}

function buildTree() {
  const nav = document.getElementById('tree');
  const q = document.getElementById('search').value.trim().toLowerCase();
  nav.innerHTML = '';
  let any = false;
  for (const cat of DATA.cats) {
    const items = DATA.items.filter(it => it.cat === cat.id).filter(it => {
      if (!q) return true;
      return ((it.ja || '') + ' ' + (it.en || '') + ' ' + (it.note_ja || '') + ' ' +
              (it.note_en || '')).toLowerCase().includes(q);
    });
    if (!items.length) continue;
    any = true;
    const det = document.createElement('details');
    det.className = 'cat';
    det.open = q ? true : (cat.id === 'quickstart' || cat.id === 'legacy' ||
                           items.some(it => it.id === (curItem && curItem.id)));
    const sum = document.createElement('summary');
    sum.textContent = T(cat);
    det.appendChild(sum);
    for (const it of items) {
      const div = document.createElement('div');
      div.className = 'item' + (it.status === 'planned' ? ' planned' : '') +
                      (curItem && curItem.id === it.id ? ' sel' : '');
      div.dataset.id = it.id;
      div.setAttribute('role', 'button');
      div.tabIndex = 0;
      div.onkeydown = ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); select(it, true); } };
      const ic = document.createElement('span');
      ic.className = 'ic';
      ic.textContent = it.status === 'planned' ? '◌' : '▶';
      const t = document.createElement('span');
      t.className = 't';
      t.textContent = T(it);
      t.title = T(it);
      div.appendChild(ic); div.appendChild(t);
      if (watched[it.id]) {
        const d = document.createElement('span');
        d.className = 'done'; d.textContent = '✔';
        div.appendChild(d);
      }
      if (isNew(it)) {
        const b = document.createElement('span');
        b.className = 'badge new'; b.textContent = UI[lang].newBadge;
        div.appendChild(b);
      }
      div.onclick = () => { select(it, true); };
      det.appendChild(div);
    }
    nav.appendChild(det);
  }
  if (!any) {
    const d = document.createElement('div');
    d.style.padding = '16px'; d.style.color = 'var(--ink2)';
    d.textContent = UI[lang].notFound;
    nav.appendChild(d);
  }
}

function embed(v) {
  const w = document.createElement('div');
  w.className = 'vwrap';
  const f = document.createElement('iframe');
  f.src = v.list ? 'https://www.youtube.com/embed/videoseries?list=' + v.list
                 : 'https://www.youtube.com/embed/' + v.yt;
  f.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
  f.allowFullscreen = true;
  f.loading = 'lazy';
  w.appendChild(f);
  return w;
}

function videoLabel(v) { return (lang === 'en' ? v.en : v.ja) || v.ja || v.en || ''; }

function memberCard(v) {
  const u = UI[lang];
  const c = document.createElement('div');
  c.className = 'memberCard';
  c.innerHTML = '<div class="big"></div><div class="mnote"></div>';
  c.querySelector('.big').textContent = u.memberBig;
  c.querySelector('.mnote').textContent = u.memberNote;
  const a = document.createElement('a');
  a.className = 'btn'; a.target = '_blank'; a.rel = 'noopener';
  a.href = 'https://www.youtube.com/watch?v=' + v.yt;
  a.textContent = u.watchOnYT + ' — ' + videoLabel(v);
  c.appendChild(a);
  const j = document.createElement('a');
  j.className = 'btn'; j.target = '_blank'; j.rel = 'noopener';
  j.href = MEMBER_JOIN_URL;
  j.textContent = u.joinBtn;
  c.appendChild(j);
  return c;
}

function refList(title, vids) {
  const det = document.createElement('details');
  det.className = 'old';
  det.open = false;
  const s = document.createElement('summary');
  s.textContent = title;
  det.appendChild(s);
  for (const v of vids) {
    const l = document.createElement('div');
    l.className = 'vlabel'; l.style.marginTop = '10px';
    l.textContent = videoLabel(v);
    det.appendChild(l);
    det.appendChild(v.member ? memberCard(v) : embed(v));
  }
  return det;
}

function render(item) {
  const u = UI[lang];
  const main = document.getElementById('content');
  main.innerHTML = '';
  if (!item) {                     // ウェルカム画面
    const h = document.createElement('h2');
    h.id = 'ttl'; h.textContent = u.welcomeTitle;
    const p = document.createElement('div');
    p.className = 'note'; p.textContent = u.welcomeBody;
    // 旧チュートリアル再生リストへの案内 (v4.0 動画が揃うまでのつなぎ)
    const lg = document.createElement('div');
    lg.className = 'placeholder';
    const lb = document.createElement('div');
    lb.className = 'big'; lb.textContent = u.legacyBig;
    const ll = document.createElement('div');
    ll.textContent = u.legacyLead;
    lg.appendChild(lb); lg.appendChild(ll);
    const mkBtn = (href, text) => {
      const b = document.createElement('a');
      b.className = 'btn'; b.target = '_blank'; b.rel = 'noopener';
      b.href = href; b.textContent = text;
      return b;
    };
    const btnJa = mkBtn(LEGACY_PLAYLIST_JA, u.legacyJaBtn);
    const btnEn = mkBtn(LEGACY_PLAYLIST_EN, u.legacyEnBtn);
    if (lang === 'en') { lg.appendChild(btnEn); lg.appendChild(btnJa); }
    else               { lg.appendChild(btnJa); lg.appendChild(btnEn); }
    const ln = document.createElement('div');
    ln.style.marginTop = '10px'; ln.style.color = 'var(--ink2)';
    ln.style.fontSize = '13px'; ln.textContent = u.legacyNote;
    lg.appendChild(ln);
    const a = document.createElement('div');
    a.className = 'aboutNote'; a.textContent = u.aboutNote;
    main.appendChild(h); main.appendChild(p); main.appendChild(lg); main.appendChild(a);
    return;
  }
  const cat = DATA.cats.find(c => c.id === item.cat);
  const h = document.createElement('h2');
  h.id = 'ttl'; h.textContent = T(item);
  const crumb = document.createElement('div');
  crumb.id = 'crumb'; crumb.textContent = cat ? T(cat) : '';
  main.appendChild(h); main.appendChild(crumb);

  const note = document.createElement('div');
  note.className = 'note'; note.textContent = TN(item);

  if (item.status === 'video' && item.videos && item.videos.length) {
    const first = item.videos[0];
    if (first.member) {
      main.appendChild(note);
      main.appendChild(memberCard(first));
    } else {
      main.appendChild(embed(first));
      const l = document.createElement('div');
      l.className = 'vlabel'; l.textContent = videoLabel(first);
      main.appendChild(l);
      main.appendChild(note);
      if (first.list) {            // プレイリストは YouTube 側でも開けるように
        const a = document.createElement('a');
        a.className = 'btn'; a.target = '_blank'; a.rel = 'noopener';
        a.href = 'https://www.youtube.com/playlist?list=' + first.list;
        a.textContent = u.openPlaylist;
        main.appendChild(a);
      }
    }
    const rest = item.videos.slice(1);
    if (rest.length) main.appendChild(refList(u.oldVideos, rest));
  } else {
    const ph = document.createElement('div');
    ph.className = 'placeholder';
    const b = document.createElement('div');
    b.className = 'big'; b.textContent = u.plannedBig;
    const n = document.createElement('div');
    n.textContent = TN(item) || u.plannedNote;
    ph.appendChild(b); ph.appendChild(n);
    main.appendChild(ph);
    if (item.refs && item.refs.length) main.appendChild(refList(u.refs, item.refs));
  }

  // 視聴済みチェック
  const chk = document.createElement('label');
  chk.className = 'chk';
  const cb = document.createElement('input');
  cb.type = 'checkbox'; cb.checked = !!watched[item.id];
  cb.onchange = () => {
    if (cb.checked) watched[item.id] = 1; else delete watched[item.id];
    try { localStorage.setItem('lcadTutWatched', JSON.stringify(watched)); } catch (e) {}
    buildTree();
  };
  chk.appendChild(cb);
  chk.appendChild(document.createTextNode(' ' + u.watched));
  main.appendChild(chk);
}

function select(item, updateHash) {
  curItem = item;
  buildTree();
  render(item);
  document.getElementById('content').scrollTop = 0;
  if (updateHash) {
    const h = '#lang=' + lang + (item ? '&item=' + item.id : '') +
              (seenStamp ? '&seen=' + seenStamp : '');
    history.replaceState(null, '', h);
  }
}

document.getElementById('search').addEventListener('input', buildTree);
document.getElementById('navToggle').addEventListener('click',
  () => document.getElementById('tree').classList.toggle('collapsed'));
window.addEventListener('hashchange', init);

function init() {
  const h = parseHash();
  let l = h.lang;
  if (!l) { try { l = localStorage.getItem('lcadTutLang'); } catch (e) {} }
  if (!l) l = (navigator.language || '').startsWith('ja') ? 'ja' : 'en';
  lang = (l === 'en') ? 'en' : 'ja';

  let th = null;
  try { th = localStorage.getItem('lcadTutTheme'); } catch (e) {}
  if (th) document.documentElement.dataset.theme = th;

  if (h.seen && /^\d{12}$/.test(h.seen)) {
    seenStamp = h.seen;
  } else {
    // ブラウザ単体で開いた場合は、前回訪問時の索引日時を localStorage から
    try {
      seenStamp = localStorage.getItem('lcadTutSeen') || '';
      localStorage.setItem('lcadTutSeen', TUTORIAL_STAMP);
    } catch (e) {}
  }

  document.documentElement.lang = lang;
  applyUI();
  curItem = DATA.items.find(it => it.id === h.item) || null;
  buildTree();
  render(curItem);
}
init();
</script>
</body>
</html>
